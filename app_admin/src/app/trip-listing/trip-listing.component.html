<div class="container">
  <div class="row">
    <div class="col-12 mb-3">
      <button class="btn btn-info" (click)="addTrip()">Add Trip</button>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip"></app-trip-card>
      <button class="btn btn-info mt-2" (click)="editTrip(trip.code)">Edit</button>
    </div>
  </div>
</div>
